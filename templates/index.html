<!DOCTYPE html>
<html>
<head>
    <title>Gender Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 10px;
            width: 250px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: blue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gender Detection System</h1>

        <form method="POST">
            <input type="text"
                   name="name"
                   placeholder="Enter Name"
                   required>
            <br>

            <button type="submit">
                Predict Gender
            </button>
        </form>

        {% if prediction %}
            <h2>Predicted Gender: {{ prediction }}</h2>
        {% endif %}
    </div>

</body>
</html>
